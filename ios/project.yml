# XcodeGen spec. On a Mac: `brew install xcodegen && cd ios && xcodegen && open Verified.xcodeproj`
name: Verified
options:
  bundleIdPrefix: com.mattrickslauer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26+ "approachable concurrency": app code is MainActor by default.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple Developer Team ID (public: it is embedded in every signed app).
    DEVELOPMENT_TEAM: S4U4JF5F7G
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # Pinned: 12.13–12.19 ship the Firebase AI Logic *hybrid* API used for the live coach
    # (FirebaseAI.SystemLanguageModel, generativeModelSession, .hybridModel(primary:secondary:)).
    # 13.0.0 removed it ("remove legacy Foundation Models integration") in favour of an iOS 27-only API.
    # Needs Xcode 26.2+ (Swift 6.2.3).
    exactVersion: "12.19.3"
  VerifiedCore:
    path: VerifiedCore

targets:
  Verified:
    type: application
    platform: iOS
    sources:
      - path: Verified
        excludes:
          - "**/GoogleService-Info.plist"
          - "Info.plist"
      - path: Verified/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      - path: ../shared/prompts.json
        buildPhase: resources
      - path: ../shared/ladder.json
        buildPhase: resources
    info:
      path: Verified/Info.plist
      properties:
        CFBundleDisplayName: Verified
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only standard HTTPS/TLS: exempt, so TestFlight skips the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A recording Moment keeps its GPS track (and the witness) going with the screen locked.
        UIBackgroundModes: [location]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Verified takes proof shots and video clips of your Moment.
        NSMicrophoneUsageDescription: Verified listens when you talk to your witness, and records sound with the video clips you take during a Moment.
        NSSpeechRecognitionUsageDescription: Verified turns what you tell your witness into text, on the device when it can.
        NSPhotoLibraryAddUsageDescription: Verified saves your Moment's video clips to Photos.
        # Full access only to find or create the "Verified" album for clips (limited access saves them without it).
        NSPhotoLibraryUsageDescription: Verified keeps your Moment's video clips together in a "Verified" album in Photos.
        NSLocationWhenInUseUsageDescription: Verified records your GPS track while a Moment is recording.
        NSMotionUsageDescription: Verified records motion while a Moment is recording, as evidence it was real.
        NSLocalNetworkUsageDescription: Used only in developer mode to reach the Firebase Emulator Suite on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sign-in (accounts.mattrickslauer.com) returns here; see Auth/AccountsSignIn.swift.
        CFBundleURLTypes:
          - CFBundleURLName: signin
            CFBundleURLSchemes: [com.mattrickslauer.verified]
    entitlements:
      path: Verified/Verified.entitlements
      properties:
        # App Attest for Firebase App Check (release builds; see App/FirebaseSetup.swift).
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattrickslauer.verified
        CURRENT_PROJECT_VERSION: "1"  # remote-build.sh --upload overrides with a timestamp build number
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: [-ObjC]
      configs:
        # Release = App Store / TestFlight. Signed headlessly by ios/scripts/remote-build.sh --upload with the
        # distribution cert + profile that ios/scripts/asc_signing.py makes via the App Store Connect API.
        # Debug keeps automatic signing for running on your own iPhone from Xcode.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Verified App Store
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
      # v3.7 callables (getCredits, runLadderModule) and the full_video clip upload.
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: VerifiedCore
    scheme:
      environmentVariables:
        # Set to 1 to use the local Firebase Emulator Suite (see README).
        USE_EMULATOR: "0"
        EMULATOR_HOST: "127.0.0.1"
