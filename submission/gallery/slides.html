<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verified gallery</title>
<link rel="stylesheet" href="assets/fonts/local.css">
<style>
:root{--bg:#0f2127;--deep:#071419;--ink:#e8ece4;--ink2:#e8ece4b8;--ink3:#e8ece470;--gold:#E7B425;--ok:#7fd19b;--bad:#f08a78;
  --glass:#0b1c22e6;--line:#e8ece426}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1500px;height:1000px;overflow:hidden;background:var(--deep)}
body{font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.slide{position:absolute;inset:0;display:none;overflow:hidden;
  background:radial-gradient(900px 600px at 80% 10%,#E7B42514,transparent 60%),radial-gradient(800px 600px at 5% 95%,#7fd19b12,transparent 60%),linear-gradient(160deg,#10262d,#081519 70%)}
.slide.on{display:block}
.grid{position:absolute;inset:0;background-image:linear-gradient(#e8ece408 1px,transparent 1px),linear-gradient(90deg,#e8ece408 1px,transparent 1px);background-size:50px 50px}
.top{position:absolute;left:64px;right:64px;top:44px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px}
.brand img{height:38px}
.badge{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:999px;background:#071419c0;border:1px solid var(--line);font-weight:700;font-size:18px}
.badge img{height:26px}
.num{font:600 16px 'JetBrains Mono';color:var(--ink3);letter-spacing:.1em}
.kicker{font:600 18px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.h1{font-weight:800;font-size:76px;line-height:1.0;letter-spacing:-.025em}
.h2{font-weight:800;font-size:58px;line-height:1.03;letter-spacing:-.02em}
.h3{font-weight:700;font-size:28px;line-height:1.2}
.body{font-weight:500;font-size:25px;line-height:1.38;color:var(--ink2)}
.mono{font-family:'JetBrains Mono'}
.gold{color:var(--gold)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.col{position:absolute;left:64px;top:150px;width:640px;display:flex;flex-direction:column;gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-weight:700;font-size:20px;background:#e8ece414;border:1px solid var(--line)}
.chip img{height:22px}
.chip.ok{background:#7fd19b1f;border-color:#7fd19b66;color:#9fe8b6}
.chip.gold{background:#E7B4251f;border-color:#E7B42566;color:#ffd866}
.chip.bad{background:#f08a781f;border-color:#f08a7866;color:#ffb3a3}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:0 20px 50px #0008}
ul.pts{list-style:none;display:flex;flex-direction:column;gap:14px}
ul.pts li{display:flex;gap:14px;font-weight:500;font-size:24px;line-height:1.3;color:var(--ink2)}
ul.pts li b{color:var(--ink)}
ul.pts li:before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:11px}
/* devices */
.iphone{position:absolute;border-radius:52px;background:#0a0a0a;padding:11px;box-shadow:0 0 0 2px #2b3a3f,0 40px 80px #000a,0 0 120px #E7B4251a}
.iphone img{display:block;width:100%;height:100%;border-radius:42px;object-fit:cover;object-position:top}
.android{position:absolute;border-radius:36px;background:#0a0a0a;padding:10px;box-shadow:0 0 0 2px #2b3a3f,0 40px 80px #000a,0 0 120px #7fd19b1a}
.android img{display:block;width:100%;height:100%;border-radius:27px;object-fit:cover;object-position:top}
.browser{position:absolute;border-radius:14px;background:#1b2428;overflow:hidden;box-shadow:0 0 0 2px #2b3a3f,0 40px 80px #000a,0 0 120px #8ab4f81a}
.browser .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#202b30}
.browser .dot{width:12px;height:12px;border-radius:50%}
.browser .url{margin-left:14px;flex:1;height:24px;border-radius:12px;background:#0f171a;color:#c9d3cf;font:500 13px 'JetBrains Mono';display:flex;align-items:center;padding-left:12px}
.browser img{display:block;width:100%}
.tag{position:absolute;display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;padding:7px 14px;border-radius:999px;background:#071419e6;border:1px solid var(--line);white-space:nowrap}
.tag img{height:20px}
.foot{position:absolute;left:64px;bottom:40px;font:600 16px 'JetBrains Mono';color:var(--ink3);letter-spacing:.06em}
/* diagram */
.flow{display:flex;align-items:stretch;gap:0}
.node{width:300px;min-height:420px;border-radius:26px;background:#0b1c22;border:2px solid var(--line);padding:28px 26px;display:flex;flex-direction:column;gap:10px}
.node .n{font:700 15px 'JetBrains Mono';color:var(--ink3)}
.node .t{font-weight:800;font-size:46px}
.node .d{font-weight:500;font-size:24px;line-height:1.3;color:var(--ink2)}
.node .w{margin-top:auto}
.arrow{width:56px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:34px;font-weight:800}
table.rt{border-collapse:separate;border-spacing:0;width:100%;font-size:23px}
table.rt th{font:600 17px 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:0 14px 12px}
table.rt td{padding:15px 14px;white-space:nowrap;border-top:1px solid var(--line);font-weight:600;color:var(--ink2)}
table.rt td:first-child{color:var(--ink);font-weight:700}
.blk{width:150px;border-radius:14px;background:#0b1c22;border:2px solid #7fd19b66;padding:12px 14px}
.blk .n{font:700 14px 'JetBrains Mono';color:var(--ok)}
.blk .s{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.blk .s i{font-style:normal;font:600 12px 'JetBrains Mono';padding:2px 6px;border-radius:5px;background:#e8ece414;color:var(--ink2)}
.blk .h{font:600 12px 'JetBrains Mono';color:var(--ink3);word-break:break-all}
.lnk{width:28px;height:5px;background:var(--ok);border-radius:3px;align-self:center}
.stamp{display:inline-flex;align-items:center;gap:14px;border:6px solid currentColor;border-radius:16px;padding:6px 22px;font-weight:800;font-size:46px;letter-spacing:.04em;text-transform:uppercase;background:#07141999}
.prod{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.prod .card{padding:24px 24px;min-height:178px}
.prod .card b{display:block;font-size:28px;margin-bottom:4px}
.prod .card span{font-size:21px;color:var(--ink2);line-height:1.3;display:block}
.qr{background:#fff;border-radius:22px;padding:20px;width:260px;height:260px}
.qr img{width:100%;height:100%;display:block}
img[src*="si-apple"]{filter:invert(1)}
</style>
</head>
<body>
<script>
const L = 'assets/logos/', S = 'shots/';
const TOTAL = 15;
const hdr = (n, badge = true) => `<div class="grid"></div><div class="top">
  <div class="brand"><img src="${L}verified-icon.svg">Verified</div>
  <div style="display:flex;gap:18px;align-items:center">${n ? `<span class="num">${String(n).padStart(2, '0')} / ${TOTAL}</span>` : ''}
  ${badge ? `<div class="badge"><img src="${L}fb-flame.svg">Firebase AI Logic · hybrid</div>` : ''}</div></div>`;
const iphone = (src, x, y, h, rot = 0) => `<div class="iphone" style="left:${x}px;top:${y}px;height:${h}px;width:${Math.round(h * 1206 / 2622)}px;transform:rotate(${rot}deg)"><img src="${S}${src}.jpg"></div>`;
const android = (src, x, y, h, rot = 0) => `<div class="android" style="left:${x}px;top:${y}px;height:${h}px;width:${Math.round(h * 1080 / 2400)}px;transform:rotate(${rot}deg)"><img src="${S}${src}.jpg"></div>`;
const browser = (src, x, y, w, crop) => `<div class="browser" style="left:${x}px;top:${y}px;width:${w}px"><div class="bar"><span class="dot" style="background:#f08a78"></span><span class="dot" style="background:#E7B425"></span><span class="dot" style="background:#7fd19b"></span><div class="url">verified-99e74.web.app</div></div><img src="${S}${src}.jpg"></div>`;
const tag = (html, x, y, cls = '') => `<div class="tag ${cls}" style="left:${x}px;top:${y}px">${html}</div>`;
const foot = (t = 'verified-99e74.web.app · iOS · Android · Chrome · #BuildHybridAI') => `<div class="foot">${t}</div>`;
const IMG = (f, h = 22) => `<img src="${L}${f}" style="height:${h}px">`;

const slides = {
// ---------------------------------------------------------------- thumbnail (3:2, must read at 300 px wide)
thumb: () => `${hdr(0, false)}
  <div style="position:absolute;left:64px;top:190px;width:700px">
    <div class="h1" style="font-size:118px;line-height:.95">Say it.<br><span class="gold">Do it.</span><br><span class="ok">Prove it.</span></div>
    <div class="h3" style="margin-top:34px;font-size:34px;color:var(--ink2)">Proof that a moment really happened, in the age of AI fakes.</div>
    <div class="chips" style="margin-top:34px">
      <span class="chip ok">${IMG('fb-flame.svg')} Firebase AI Logic</span>
      <span class="chip">${IMG('gemini-color.svg')} Gemini Nano + Apple FM</span></div>
  </div>
  ${browser('web_18.5', 760, 150, 680)}
  ${iphone('blink', 1040, 300, 640, 4)}
  ${android('and_14', 790, 360, 600, -5)}`,

// 01 cover
s1: () => `${hdr(1)}
  <div class="col" style="top:170px;width:660px">
    <div class="kicker">#BuildHybridAI · iOS · Android · Chrome</div>
    <div class="h1" style="font-size:92px">Verified</div>
    <div class="h2" style="font-size:44px;color:var(--ink2)">An <span class="gold">on-device intent &amp; evidence factory</span>.</div>
    <div class="body">Say what you're about to do. The phone plans the proof, coaches you while you collect it, and chains every second with SHA-256. Cloud AI reads it. Code seals it.</div>
    <div class="chips">
      <span class="chip ok">${IMG('gemini-color.svg')} Gemini Nano · on-device</span>
      <span class="chip ok">${IMG('si-apple.svg')} Apple Foundation Models</span>
      <span class="chip gold">${IMG('gemini-color.svg')} Gemini · cloud fallback</span></div>
  </div>
  ${browser('web_8', 760, 160, 680)}
  ${android('and_8', 800, 380, 560, -4)}
  ${iphone('feed', 1110, 330, 620, 4)}
  ${foot()}`,

// 02 problem
s2: () => `${hdr(2)}
  <div class="col">
    <div class="kicker">The problem</div>
    <div class="h1">A photo is no longer proof.</div>
    <div class="body">Anyone can generate a catch, a summit or a workout in seconds, or just photograph a screen. Fishing derbies, fitness challenges and sponsor contests still pay out on <i>"pics or it didn't happen"</i>.</div>
    <div class="card" style="border-color:#E7B42566">
      <div class="h3">Faking one frame is <span class="ok">easy</span>.<br>Faking a whole session is <span class="bad">hard</span>.</div>
      <div class="body" style="font-size:21px;margin-top:8px">Minutes of GPS, motion, timing and video that all agree, bound by a hash chain. Verified records the session.</div></div>
  </div>
  ${android('and_14', 1000, 130, 800, 0)}
  ${tag(`<span class="bad">●</span> AI fish filmed off a laptop`, 700, 330)}
  ${tag(`<span class="bad">●</span> Skeptic: "photos of a screen"`, 720, 700)}
  ${foot()}`,

// 03 the factory
s3: () => `${hdr(3)}
  <div style="position:absolute;left:64px;top:150px;width:1370px">
    <div class="kicker">How it works</div>
    <div class="h2" style="margin-top:14px">One pipeline for <span class="gold">any intent</span>: push-ups, a catch, a run, a song.</div>
  </div>
  <div class="flow" style="position:absolute;left:64px;top:340px">
    <div class="node"><div class="n">01 · SAY IT</div><div class="t">Intent</div><div class="d">A voice interview turns one sentence into checkable <b>claims</b> + an <b>evidence plan</b>.</div><div class="w"><span class="chip ok">on-device</span></div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="n">02 · DO IT</div><div class="t">Evidence</div><div class="d">GPS, motion, video, proof shots. SHA-256 chain every 5 s. A coach and a witness ask for what's missing.</div><div class="w"><span class="chip ok">on-device · offline</span></div></div>
    <div class="arrow">→</div>
    <div class="node"><div class="n">03 · READ IT</div><div class="t">AI reads</div><div class="d">Gemini watches the video claim by claim. Judge, skeptic and scorer read the frames.</div><div class="w"><span class="chip gold">cloud</span></div></div>
    <div class="arrow">→</div>
    <div class="node" style="border-color:#7fd19b88"><div class="n">04 · PROVE IT</div><div class="t">Seal</div><div class="d">A Cloud Function re-checks chain, timing and physics. Only code can write the seal.</div><div class="w"><span class="chip">deterministic code</span></div></div>
  </div>
  <div style="position:absolute;left:64px;top:810px;font-size:44px" class="h2"><span class="gold">AI proposes.</span> <span class="ok">Code decides.</span></div>
  ${foot('')}`,

// 04 say it
s4: () => `${hdr(4)}
  <div class="col" style="width:600px">
    <div class="kicker">01 · Say it</div>
    <div class="h2">Your intent becomes claims and an evidence plan.</div>
    <ul class="pts">
      <li><span><b>Voice interview on the device</b>: follow-up questions run on Gemini Nano / Apple Foundation Models, no signal needed.</span></li>
      <li><span><b>Claims</b> you can check one at a time: <span class="mono" style="font-size:20px">doing push-ups · 10 reps · Punta Arenas</span>.</span></li>
      <li><span><b>Evidence plan</b>: the minimum a fair skeptic would need ("one continuous video of all 10").</span></li>
      <li><span>Final structuring uses <b>Gemini in the cloud</b> with a strict JSON schema.</span></li>
    </ul>
  </div>
  ${iphone('interview', 730, 130, 800)}
  ${iphone('plan', 1100, 130, 800)}
  ${tag(`<span class="ok">●</span> questions on device`, 740, 880)}
  ${tag(`<span class="gold">●</span> claims + plan`, 1150, 880)}`,

// 05 do it
s5: () => `${hdr(5)}
  <div class="col" style="width:640px">
    <div class="kicker">02 · Do it</div>
    <div class="h2">Record the session, not a snapshot.</div>
    <div class="body">GPS at ~1 Hz, accelerometer and gyroscope at 10 Hz, video and proof shots. Every 5 seconds the data closes into a chunk chained to the last one. Change one byte later and the chain breaks.</div>
    <div style="display:flex;gap:0;margin-top:6px">
      <div class="blk"><div class="n">#0041</div><div class="s"><i>GPS</i><i>IMU</i><i>VID</i></div><div class="h">sha256 9f2c…a71e</div></div><div class="lnk"></div>
      <div class="blk"><div class="n">#0042</div><div class="s"><i>GPS</i><i>IMU</i><i>SHOT</i></div><div class="h">prev 9f2c… → 41be…07d3</div></div><div class="lnk"></div>
      <div class="blk"><div class="n">#0043</div><div class="s"><i>GPS</i><i>IMU</i><i>VID</i></div><div class="h">prev 41be… → c8a0…5f19</div></div>
    </div>
    <div class="chips"><span class="chip ok">Offline-first: Firestore persistence + raw vault</span><span class="chip">raw deleted only after the server provably holds it</span></div>
  </div>
  ${iphone('record', 1010, 110, 830)}`,

// 06 coach
s6: () => `${hdr(6)}
  <div class="col" style="width:620px">
    <div class="kicker">On-device coach · PREFER_ON_DEVICE</div>
    <div class="h2">The small model can say <span class="gold">"retake"</span>. Never <span class="ok">"verified"</span>.</div>
    <ul class="pts">
      <li><span>Every proof shot is checked against your intent <b>on the device in under a second</b>, even with no signal.</span></li>
      <li><span><b>The image never leaves the phone</b> for this check. Free, private, instant.</span></li>
      <li><span>No local model? The same call <b>falls back to Gemini in the cloud</b>, and the app shows which one answered.</span></li>
      <li><span>A hallucinating or tampered local model can, at worst, <b>ask for a retake</b>.</span></li>
    </ul>
  </div>
  ${iphone('fishcheck', 740, 130, 800)}
  ${iphone('retake', 1110, 130, 800)}
  ${tag(`${IMG('gemini-color.svg', 20)} Checking on-device…`, 750, 880)}
  ${tag(`<span class="gold">●</span> Retake: no push-ups visible`, 1080, 880)}`,

// 07 witness
s7: () => `${hdr(7)}
  <div class="col" style="width:640px">
    <div class="kicker">Live AI witness</div>
    <div class="h2">A witness that asks for what a skeptic would want.</div>
    <ul class="pts">
      <li><span>Reads the evidence plan and asks, out loud and on screen, for <b>unmet items first</b>: "Show the video of all 10 push-ups."</span></li>
      <li><span>Tap <b>Show</b>: the answer is captured and <b>goes into the hash chain</b>.</span></li>
      <li><span><b>Drafts run on-device</b> about once a minute; a <b>cloud refine</b> sharpens them when there's signal (4 s budget).</span></li>
      <li><span>Phone locked? It sends a notification.</span></li>
    </ul>
  </div>
  ${iphone('witness', 1010, 110, 830)}
  ${tag(`<span class="ok">●</span> Witness · on device`, 1060, 870)}`,

// 08 hybrid routing
s8: () => `${hdr(8)}
  <div style="position:absolute;left:64px;top:140px;width:1370px">
    <div class="kicker">Firebase AI Logic hybrid inference</div>
    <div class="h2" style="margin-top:12px;font-size:50px">Every job runs where it makes sense, on three platforms.</div>
  </div>
  <div class="card" style="position:absolute;left:64px;top:310px;width:1372px;padding:22px 10px 8px">
  <table class="rt">
    <tr><th>AI job</th><th>Mode</th><th>${IMG('chrome-color.svg', 16)} Web</th><th>${IMG('android-color.svg', 16)} Android</th><th>${IMG('si-apple.svg', 16)} iOS</th></tr>
    <tr><td>Live coach · every shot</td><td class="ok">PREFER_ON_DEVICE</td><td>Gemini Nano · image</td><td>Gemini Nano</td><td>Apple FM + Vision</td></tr>
    <tr><td>Interview turns</td><td class="ok">PREFER_ON_DEVICE</td><td>Gemini Nano</td><td>Gemini Nano</td><td>Apple FM</td></tr>
    <tr><td>Witness draft · bar preview</td><td class="ok">PREFER_ON_DEVICE</td><td>Gemini Nano</td><td>Gemini Nano</td><td>Apple FM</td></tr>
    <tr><td>Intent schema · judge · skeptic · scorer</td><td class="gold">ONLY_IN_CLOUD</td><td>Gemini</td><td>Gemini</td><td>Gemini</td></tr>
    <tr><td>Bar · video review · ladder</td><td>Cloud Functions</td><td colspan="3">Gemini on Vertex AI · no client can set its own result</td></tr>
  </table></div>
  <div class="chips" style="position:absolute;left:64px;top:690px">
    <span class="chip ok">response.inferenceSource stored on every call</span>
    <span class="chip">shown in-app as an On-device / Cloud chip</span>
    <span class="chip gold">Remote Config picks the cloud model</span></div>`,

// 09 cloud reads
s9: () => `${hdr(9)}
  <div class="col" style="width:620px">
    <div class="kicker">03 · Read it · cloud</div>
    <div class="h2">Four independent AI reads.</div>
    <div class="card"><div class="h3">${IMG('gemini-color.svg', 24)} Video review</div><div class="body" style="font-size:21px">Gemini watches the whole clip from Cloud Storage and rules claim by claim.</div></div>
    <div class="card"><div class="h3">Judge</div><div class="body" style="font-size:21px">Is the evidence consistent with each claim?</div></div>
    <div class="card"><div class="h3 bad">Skeptic</div><div class="body" style="font-size:21px">Staging, photos of screens, AI images, place/time mismatch.</div></div>
    <div class="card"><div class="h3 gold">Scorer</div><div class="body" style="font-size:21px">P(claim true) from a cheater-heavy 0.2 prior.</div></div>
  </div>
  ${iphone('judging', 740, 130, 800)}
  ${iphone('claims', 1110, 130, 800)}`,

// 10 seal
s10: () => `${hdr(10)}
  <div class="col" style="width:620px">
    <div class="kicker">04 · Prove it · deterministic seal</div>
    <div class="h2">AI proposes. <span class="ok">Only code can seal.</span></div>
    <ul class="pts">
      <li><span>Gemini rates how hard the claim is; <b>code maps it to a bar</b> between 0.50 and 0.95.</span></li>
      <li><span>The Cloud Function <b>recomputes the hash chain</b>, timing, frame hashes and <b>physics</b> (no GPS jump over 70 m/s).</span></li>
      <li><span>Any cheating signal caps every claim at 0.1.</span></li>
      <li><span>Firestore rules make the seal, feed, score and credits <b>server-only</b>.</span></li>
    </ul>
    <div><span class="stamp ok">Verified ✓ · 3/3</span></div>
  </div>
  ${iphone('verified', 740, 130, 800)}
  ${iphone('detail', 1110, 130, 800)}`,

// 11 fakes
s11: () => `${hdr(11)}
  <div class="col" style="width:600px">
    <div class="kicker">It catches fakes</div>
    <div class="h2">Not every Moment gets the stamp.</div>
    <div class="body">An AI-generated fish filmed off a laptop: the skeptic spots the screen. An ABC song that stops halfway: the video review says the claim isn't backed.</div>
    <div><span class="stamp bad">Not verified</span></div>
    <div class="body" style="font-size:21px">Every reason, every check and every score is public on the Moment.</div>
  </div>
  ${android('and_14', 720, 130, 800)}
  ${iphone('abc', 1110, 130, 800)}`,

// 12 three platforms
s12: () => `${hdr(12)}
  <div style="position:absolute;left:64px;top:140px;width:1370px">
    <div class="kicker">Multi-platform · one contract · one backend</div>
    <div class="h2" style="margin-top:12px">One hybrid SDK. <span class="gold">Three native apps.</span></div>
  </div>
  ${iphone('blink', 110, 300, 620)}
  ${android('and_8', 450, 300, 620)}
  ${browser('web_18.5', 790, 330, 640)}
  ${tag(`${IMG('si-apple.svg', 18)} SwiftUI · Apple Foundation Models`, 70, 935)}
  ${tag(`${IMG('android-color.svg', 18)} Compose · Gemini Nano`, 450, 935)}
  ${tag(`${IMG('chrome-color.svg', 18)} React · Gemini Nano in Chrome`, 900, 790)}
