<style>
:root{
  --bg:#0f2127; --deep:#071419; --ink:#e8ece4; --ink2:#e8ece4b3; --ink3:#e8ece466;
  --gold:#E7B425; --ok:#7fd19b; --bad:#f08a78; --glass:#0b1c22e6; --line:#e8ece426;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--deep)}
.layer{position:absolute;inset:0}
#roll{transform-origin:1330px 330px}
#roll img{position:absolute;inset:0;width:1920px;height:1080px}
#cutbg{background:
  radial-gradient(1100px 700px at 75% 20%, #E7B42514, transparent 60%),

#grid{background-image:linear-gradient(#e8ece40a 1px,transparent 1px),linear-gradient(90deg,#e8ece40a 1px,transparent 1px);
  background-size:60px 60px}
#dim{background:linear-gradient(90deg,#071419f2 0%,#071419e6 40%,#07141999 54%,#07141900 64%)}
.scene{position:absolute;inset:0;display:none}
.it{position:absolute;will-change:transform,opacity}
/* devices */
.iphone{position:absolute;border-radius:58px;background:#0a0a0a;padding:12px;
  box-shadow:0 0 0 2px #2b3a3f, 0 40px 80px #000a, 0 0 120px #E7B4251a}
.iphone img{display:block;width:100%;height:100%;border-radius:46px;object-fit:cover}
.android{position:absolute;border-radius:40px;background:#0a0a0a;padding:11px;
  box-shadow:0 0 0 2px #2b3a3f, 0 40px 80px #000a, 0 0 120px #7fd19b1a}
.android img{display:block;width:100%;height:100%;border-radius:30px;object-fit:cover}
.browser{position:absolute;border-radius:16px;background:#1b2428;overflow:hidden;
  box-shadow:0 0 0 2px #2b3a3f, 0 40px 80px #000a, 0 0 120px #8ab4f81a}
.browser .bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#202b30}
.browser .dot{width:13px;height:13px;border-radius:50%}
.browser .url{margin-left:18px;flex:1;height:28px;border-radius:14px;background:#0f171a;color:#c9d3cf;
  font:500 15px 'JetBrains Mono';display:flex;align-items:center;padding-left:14px;gap:8px}
.browser img{display:block;width:100%}
/* cards */
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px 24px;
  box-shadow:0 20px 50px #0008;backdrop-filter:blur(8px)}
.kicker{font:600 17px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.h1{font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-.02em}
.h2{font-weight:800;font-size:44px;line-height:1.06;letter-spacing:-.015em}
.h3{font-weight:700;font-size:30px;line-height:1.15}
.body{font-weight:500;font-size:24px;line-height:1.3;color:var(--ink2)}
.mono{font-family:'JetBrains Mono';}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 18px;
  font-weight:700;font-size:24px;background:#e8ece414;border:1px solid var(--line)}
.chip.gold{background:#E7B4251f;border-color:#E7B42566;color:#ffd866}
.chip.ok{background:#7fd19b1f;border-color:#7fd19b66;color:#9fe8b6}
.chip.bad{background:#f08a781f;border-color:#f08a7866;color:#ffb3a3}
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:14px}
.gold{color:var(--gold)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.stamp{border:7px solid currentColor;border-radius:18px;padding:8px 26px;font-weight:800;font-size:68px;
  letter-spacing:.04em;text-transform:uppercase;background:#07141999}
/* bubble */
#bubble{position:absolute;left:1600px;top:770px;width:260px;height:260px;border-radius:50%;overflow:hidden;
  border:5px solid var(--gold);box-shadow:0 20px 50px #000a}
#bubble img{position:absolute;width:832px;height:468px;left:-400px;top:-30px}
/* captions */
#caps{position:absolute;left:0;right:0;top:962px;display:flex;justify-content:center;pointer-events:none}
#caps .box{display:flex;flex-wrap:wrap;justify-content:center;gap:0 18px;max-width:1300px;padding:10px 26px;
  border-radius:18px;background:#071419b8;}
#caps span{font-weight:800;font-size:50px;letter-spacing:-.01em;color:#fff;display:inline-block;
  text-shadow:0 3px 12px #000c;transform-origin:50% 70%}
#caps span.on{color:var(--gold)}
#caps span.fut{color:#ffffff8c}
/* chrome */
#stepper{position:absolute;left:56px;top:44px;display:flex;gap:10px;align-items:center}
#stepper .s{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;padding:9px 16px;border-radius:999px;

#stepper .s.done{color:var(--ok)}
#stepper .arrow{width:26px;height:2px;background:var(--line)}
#mark{position:absolute;right:52px;top:44px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 12px;border-radius:999px;
  background:#071419c0;border:1px solid var(--line);font-weight:700;font-size:20px}
#mark img{height:30px}
#flash{background:#fff;opacity:0}
.qrwrap{position:relative;background:#fff;border-radius:28px;padding:26px}
.qrwrap img{display:block}
.qrwrap .laser{position:absolute;left:14px;right:14px;height:4px;border-radius:2px;background:var(--gold);
  box-shadow:0 0 18px 6px #E7B42599}
.qrwrap .br{position:absolute;width:46px;height:46px;border:6px solid var(--gold)}
.blk{position:absolute;width:190px;height:178px;border-radius:18px;background:#0b1c22;border:2px solid #7fd19b66;padding:14px 16px}
.blk .n{font:700 16px 'JetBrains Mono';color:var(--ok)}
.blk .sig{display:flex;gap:6px;margin:10px 0}
.blk .sig i{font-style:normal;font:600 13px 'JetBrains Mono';padding:3px 7px;border-radius:6px;background:#e8ece414;color:var(--ink2)}
.blk .h{font:600 14px 'JetBrains Mono';color:var(--ink2);word-break:break-all;line-height:1.35}
.lnk{position:absolute;height:6px;border-radius:3px;background:var(--ok)}
.node{position:relative;width:250px;height:250px;border-radius:40px;background:#0b1c22;border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.node .ico{font-size:84px}
.node .t{font-weight:800;font-size:36px}
.node .sub{font:600 16px 'JetBrains Mono';color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.wire{position:absolute;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.wire i{position:absolute;inset:0;background:var(--gold);transform-origin:0 50%}
.dotp{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.photo{position:absolute;width:330px;height:390px;background:#f4f1ea;border-radius:10px;padding:16px 16px 70px;box-shadow:0 30px 60px #000b}
.photo .img{width:100%;height:100%;border-radius:4px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,#7fb8d8,#cfe6ef 60%,#8fb07a 60%,#5e8a55)}
.photo .cap{position:absolute;left:18px;bottom:20px;font:700 22px 'Bricolage Grotesque';color:#20302f}
</style>

<div id="stage">
  <div class="layer" id="roll"><img id="ra"></div>

<script>
// ---------------------------------------------------------------- constants
const FPS = 30, INTRO = 4.0, ROLL_IN = 1.2, ROLL_OUT = 149.0, OUTRO = 6.0;
const TOTAL = INTRO + (ROLL_OUT - ROLL_IN) + OUTRO;
const WORDS = DATA.words, CLIPN = DATA.clipn;
const RA_N = DATA.ran;
const $ = (s, el = document) => el.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const oc = p => 1 - Math.pow(1 - clamp(p), 3);                // ease out cubic
const io = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const ob = p => { p = clamp(p); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const win = (r, a, b, f = .35) => clamp(Math.min((r - a) / f + .5, (b - r) / f + .5));  // soft window
const pad = n => String(n).padStart(5, '0');
const norm = s => s.toLowerCase().replace(/[^a-z0-9-]/g, '');
// time of a spoken word nearest to `near` (A-roll seconds)
function W(word, near) {
  let best = null;
  for (const w of WORDS) if (norm(w.w) === norm(word) && (!best || Math.abs(w.s - near) < Math.abs(best.s - near))) best = w;
  if (!best || Math.abs(best.s - near) > 4) { console.warn('W miss', word, near); return near; }
  return best.s;
}
const ICON = {
  pin:'<path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',

  hash:'<path d="M5 9h14M5 15h14M10 3 8 21M16 3l-2 18"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  wifioff:'<path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 5-2.7M19 12.5a10 10 0 0 0-2.4-1.6M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 11 5"/><circle cx="12" cy="20" r="1"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  cloud:'<path d="M17.5 19H8a6 6 0 1 1 5.7-8A4.5 4.5 0 1 1 17.5 19z"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5A2.1 2.1 0 0 0 16.5 4.5L13 8 4.8 6.2l-1.6 1.6 6.6 3.5-3.3 3.3-2.2-.4-1.2 1.2 3.3 1.8 1.8 3.3 1.2-1.2-.4-2.2 3.3-3.3 3.5 6.6z"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  judge:'<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/>',
  gauge:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>',
  camera:'<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  seal:'<path d="M12 2l2.4 2.1 3.2-.3.9 3.1 2.8 1.6-1.1 3 1.1 3-2.8 1.6-.9 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.9-3.1-2.8-1.6 1.1-3-1.1-3 2.8-1.6.9-3.1 3.2.3z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  quote:'<path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/>',
  sync:'<path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M3 21v-5h5"/>',
};
const ic = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const LOGO = n => `assets/logos/${n}`;

// ---------------------------------------------------------------- scene system
// A scene: {a, b, mode:'full'|'split'|'cut', bubble, el, items[], fn(r)}
const SCENES = [], CUES = [];
function scene(a, b, mode, opts = {}) {
  const el = document.createElement('div'); el.className = 'scene'; $('#scenes').appendChild(el);
  const s = { a, b, mode, el, items: [], bubble: !!opts.bubble, fade: opts.fade ?? .35, fn: null, step: opts.step ?? -1 };
  SCENES.push(s); return s;
}
// item: absolutely placed html that animates in at `at` (and optionally out at `until`)
function item(s, html, o) {
  const el = document.createElement('div'); el.className = 'it'; el.innerHTML = html;
  Object.assign(el.style, { left: (o.x ?? 0) + 'px', top: (o.y ?? 0) + 'px' });
  if (o.w) el.style.width = o.w + 'px';
  if (o.style) Object.assign(el.style, o.style);
  s.el.appendChild(el);
  const it = { el, at: o.at ?? s.a, until: o.until ?? 1e9, anim: o.anim ?? 'up', dur: o.dur ?? .5, origin: o.origin };
  if (o.origin) el.style.transformOrigin = o.origin;
  if (o.cue !== false) CUES.push({ r: it.at, kind: o.cue ?? (it.anim === 'stamp' ? 'stamp' : 'pop') });
  s.items.push(it); return el;
}
function animItem(it, r) {
  const p = (r - it.at) / it.dur, q = (r - it.until) / .3;
  let op = clamp(p * 1.6) * (1 - clamp(q)), tf = '';
  const e = oc(p), b = ob(p);
  switch (it.anim) {
    case 'up': tf = `translateY(${(1 - e) * 40}px)`; break;
    case 'left': tf = `translateX(${(1 - e) * -60}px)`; break;
    case 'right': tf = `translateX(${(1 - e) * 80}px)`; break;
    case 'pop': tf = `scale(${lerp(.6, 1, b)})`; break;
    case 'stamp': { const k = clamp(p * 1.4); tf = `scale(${lerp(2.4, 1, oc(k))}) rotate(${lerp(-18, -7, oc(k))}deg)`; op = clamp(k * 3) * (1 - clamp(q)); break; }
    case 'fade': tf = ''; break;
    case 'drop': tf = `translateY(${(1 - b) * -120}px) rotate(${(1 - e) * -10}deg)`; break;
  }
  if (q > 0) tf += ` translateY(${-oc(q) * 20}px)`;
  it.el.style.opacity = op; it.el.style.transform = tf;
  it.el.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
}
// devices
const iphone = (clip, start, h, extra = '') =>
  `<div class="iphone" style="width:${Math.round(h * 1206 / 2622) + 24}px;height:${h + 24}px;${extra}">
     <img data-clip="${clip}" data-start="${start}"></div>`;
const iphoneStill = (src, h) =>
  `<div class="iphone" style="width:${Math.round(h * 1206 / 2622) + 24}px;height:${h + 24}px"><img src="${src}"></div>`;
const android = (clip, start, h) =>
  `<div class="android" style="width:${Math.round(h * 1080 / 2400) + 22}px;height:${h + 22}px"><img data-clip="${clip}" data-start="${start}"></div>`;
const androidStill = (src, h) =>
  `<div class="android" style="width:${Math.round(h * 1080 / 2400) + 22}px;height:${h + 22}px"><img src="${src}"></div>`;
const browser = (clip, start, w) =>
  `<div class="browser" style="width:${w}px"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
   <div class="url">${ic('lock')} verified-99e74.web.app</div></div><img data-clip="${clip}" data-start="${start}" style="height:${Math.round(w * 800 / 1280)}px"></div>`;

// ================================================================= SCENES ==
// ---- INTRO title card (r -2.8 .. 1.2) --------------------------------------
{
  const s = scene(-2.8, 2.05, 'full', { fade: .01 });
  s.el.innerHTML = `<div class="layer" style="background:radial-gradient(1000px 700px at 30% 40%, #E7B42522, transparent 60%),linear-gradient(160deg,#10262d,#071419 70%)"></div>
    <div class="layer" style="background-image:linear-gradient(#e8ece40a 1px,transparent 1px),linear-gradient(90deg,#e8ece40a 1px,transparent 1px);background-size:60px 60px"></div>`;
  const a = -2.8;
  item(s, `<img src="${LOGO('verified-icon.svg')}" style="width:150px;border-radius:34px;box-shadow:0 20px 60px #E7B42544">`, { x: 150, y: 210, at: a + .15, anim: 'pop', cue: 'whoosh' });
  item(s, `<div style="font-weight:800;font-size:190px;letter-spacing:-.04em;line-height:.9">Verified</div>`, { x: 140, y: 380, at: a + .35, anim: 'up' });
  item(s, `<div class="h2" style="font-size:52px"><span>Say it.</span> <span class="gold">Do it.</span> <span class="ok">Prove it.</span></div>`, { x: 150, y: 575, at: a + .75 });
  item(s, `<div class="body" style="font-size:30px;max-width:900px">An on-device intent &amp; evidence factory: AI on your phone plans the proof, the cloud checks it, code seals it.</div>`, { x: 150, y: 660, at: a + 1.0 });
  item(s, `<div class="row" style="gap:22px;font-weight:700;font-size:26px;color:var(--ink2)">
      <span>Built with</span><img src="${LOGO('fb-wordmark-white.svg')}" style="height:54px">
      <span style="width:2px;height:40px;background:var(--line)"></span>
      <img src="${LOGO('gemini-color.svg')}" style="height:42px"><span style="color:var(--ink)">Gemini</span>
      <span style="width:2px;height:40px;background:var(--line)"></span>
      <span class="chip gold" style="font-size:22px">#BuildHybridAI</span></div>`, { x: 150, y: 830, at: a + 1.3 });
  const qr = item(s, `<div class="qrwrap" id="qr1"><img src="qr-web.svg" style="width:380px;height:380px"><div class="laser"></div>
      <div class="br" style="left:-10px;top:-10px;border-right:0;border-bottom:0;border-radius:14px 0 0 0"></div>
      <div class="br" style="right:-10px;top:-10px;border-left:0;border-bottom:0;border-radius:0 14px 0 0"></div>
      <div class="br" style="left:-10px;bottom:-10px;border-right:0;border-top:0;border-radius:0 0 0 14px"></div>
      <div class="br" style="right:-10px;bottom:-10px;border-left:0;border-top:0;border-radius:0 0 14px 0"></div></div>
      <div style="text-align:center;margin-top:30px"><div class="h3">Scan to try it</div>
      <div class="mono" style="font-size:22px;color:var(--gold);margin-top:6px">verified-99e74.web.app</div>
      <div class="row" style="justify-content:center;gap:18px;margin-top:16px;color:var(--ink2);font-weight:700;font-size:20px">
        <img src="${LOGO('si-apple.svg')}" style="height:24px;filter:invert(1)">iOS
        <img src="${LOGO('android-color.svg')}" style="height:26px">Android
        <img src="${LOGO('chrome-color.svg')}" style="height:24px">Web</div></div>`, { x: 1290, y: 190, at: a + .55, anim: 'pop' });
  s.fn = r => {
    const lt = r - a, laser = $('.laser', qr);
    laser.style.top = (14 + (0.5 - 0.5 * Math.cos(lt * 2.4)) * 400) + 'px';
    const out = io((r - 1.3) / .7);           // exit: zoom through
    s.el.style.opacity = 1 - out;
    s.el.style.transform = `scale(${1 + out * .12})`;
  };
  CUES.push({ r: 1.35, kind: 'whoosh' });
}

// ---- 1. Hook: name lower third --------------------------------------------
{
  const s = scene(1.2, 5.6, 'full');
  item(s, `<div class="card" style="display:flex;gap:20px;align-items:stretch;padding:18px 30px 18px 22px"><div style="width:8px;border-radius:4px;background:var(--gold)"></div>
     <div><div class="h2" style="font-size:54px">Mattricks Lauer</div><div class="kicker" style="margin-top:8px">Founder &amp; developer · Verified</div></div></div>`,
     { x: 96, y: 720, at: 2.4, anim: 'left', until: 5.4 });
}
// ---- 2. Photo used to be proof (4.5 .. 18.6) -------------------------------
{
  const s = scene(4.45, 18.7, 'split');

{

// ---------------------------------------------------------------- stepper
const STEPS = ['Intent', 'Evidence', 'Seal'];
$('#stepper').innerHTML = STEPS.map((s, i) => `${i ? '<div class="arrow"></div>' : ''}<div class="s" data-s="${i}"><b>0${i + 1}</b>${s}</div>`).join('');

// ---------------------------------------------------------------- captions
const CHUNKS = [];
{
  let cur = [];
  const flush = () => { if (cur.length) CHUNKS.push(cur); cur = []; };
  WORDS.forEach((w, i) => {
    const prev = cur[cur.length - 1];
    if (prev && (w.s - prev.e > .5)) flush();
    cur.push(w);
    const end = /[.?!]$/.test(w.w) || (/,$/.test(w.w) && cur.length >= 3) || cur.length >= 5;
    if (end) flush();
  });
  flush();
  CHUNKS.forEach((c, i) => { c.a = c[0].s - .08; c.b = Math.min(c[c.length - 1].e + .6, CHUNKS[i + 1] ? CHUNKS[i + 1][0].s - .08 : 1e9); });
}
const NOCAPS = [[144.8, 149]];
let lastChunk = -1;
function caps(r) {
  const box = $('#caps .box');
  const hide = NOCAPS.some(([a, b]) => r >= a && r < b) || r < 1.98 || r > 148.6;
  const k = hide ? -1 : CHUNKS.findIndex(c => r >= c.a && r < c.b);
  if (k !== lastChunk) {
    box.innerHTML = k < 0 ? '' : CHUNKS[k].map(w => `<span>${w.w.replace(/</g, '&lt;')}</span>`).join('');
    lastChunk = k;
  }
  box.style.display = k < 0 ? 'none' : 'flex';
  if (k < 0) return;
  const c = CHUNKS[k];
  const enter = oc((r - c.a) / .18);
  box.style.transform = `translateY(${(1 - enter) * 14}px)`; box.style.opacity = enter;
  [...box.children].forEach((sp, i) => {
    const w = c[i], on = r >= w.s && r < (c[i + 1] ? c[i + 1].s : w.e + .3);
    sp.className = on ? 'on' : (r < w.s ? 'fut' : '');
    const pop = on ? ob((r - w.s) / .18) : 1;
    sp.style.transform = on ? `scale(${lerp(.92, 1.05, pop)})` : '';
  });
}

// ---------------------------------------------------------------- roll / modes
const PUNCH = [[2.0, 4.8, 1.07, 'settle'], [18.7, 21.15, 1.06], [64.95, 67.4, 1.16], [144.8, 149, 1.12]];
function rollZoom(r) {
  let z = 1;
  for (const [a, b, s, kind] of PUNCH) {
    if (kind === 'settle') z = Math.max(z, lerp(s, 1, io((r - a) / (b - a))) * (r >= a - 1 && r < b ? 1 : 0) || 1);
    else z = Math.max(z, lerp(1, s, win(r, a, b, .5)));
  }
  return z * (1 + .015 * Math.sin(r * .21));     // breathing drift
}
const imgs = new Map();
function setImg(img, src) { if (img.getAttribute('src') !== src) { img.src = src; imgs.set(img, src); } }

async function renderFrame(t) {
  imgs.clear();
  const r = t - INTRO + ROLL_IN;
  // weights
  let cut = 0, split = 0, bubble = 0, step = -1;
  for (const s of SCENES) {
    const w = win(r, s.a, s.b, s.fade);
    if (s.mode === 'cut') cut = Math.max(cut, w);
    if (s.mode === 'split') split = Math.max(split, w);
    if (s.bubble) bubble = Math.max(bubble, w);
    if (w > .5 && s.step >= 0) step = s.step;
    const vis = w > 0.001;
    s.el.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    if (s.mode !== 'full' || s.fade > .02) s.el.style.opacity = w;
    s.items.forEach(it => animItem(it, r));
    if (s.fn) s.fn(r);
    s.el.querySelectorAll('img[data-clip]').forEach(img => {
      const clip = img.dataset.clip, n = CLIPN[clip];
      const f = clamp(Math.floor((r - +img.dataset.start) * FPS) + 1, 1, n);
      setImg(img, `frames/${clip}/${pad(f)}.jpg`);
    });
  }
  // A-roll
  const rf = clamp(Math.floor((r - ROLL_IN) * FPS) + 1, 1, RA_N);
  setImg($('#ra'), `frames/ra/${pad(rf)}.jpg`);
  $('#roll').style.transform = `scale(${rollZoom(r)})`;
  $('#roll').style.opacity = 1 - cut;
  $('#dim').style.opacity = split;
  $('#cutbg').style.opacity = cut; $('#grid').style.opacity = cut * .8;
  $('#grid').style.backgroundPosition = `${r * 6}px ${r * 3}px`;
  const bo = bubble;
  $('#bubble').style.display = bo > .001 ? 'block' : 'none';
  if (bo > .001) { setImg($('#ra2'), `frames/ra/${pad(rf)}.jpg`); $('#bubble').style.opacity = bo; $('#bubble').style.transform = `scale(${lerp(.6, 1, ob(bo))})`; }
  // stepper + watermark
  const stepVis = win(r, 29.15, 111.35, .4);
  $('#stepper').style.opacity = stepVis;
  $('#stepper').querySelectorAll('.s').forEach(e => { const i = +e.dataset.s; e.className = 's' + (i === step ? ' on' : i < step ? ' done' : ''); });
  $('#mark').style.opacity = win(r, 1.6, 148.5, .6) * (1 - win(r, 121.65, 137.2, .4)) * (1 - win(r, 111.35, 121.65, .4)) * .95;
  caps(r);
  // white flash on the two stamps that matter
  const fl = [W('seal', 110.2), W('rejected', 117.3)].reduce((m, x) => Math.max(m, 1 - clamp(Math.abs(r - x - .05) / .12)), 0);
  $('#flash').style.opacity = fl * .18;
  await Promise.all([...imgs.keys()].map(i => i.decode().catch(() => {})));
  return true;
}
window.renderFrame = renderFrame;
window.META = { TOTAL, FPS, INTRO, ROLL_IN, cues: () => CUES.map(c => ({ t: c.r - ROLL_IN + INTRO, kind: c.kind })) };
window.READY = document.fonts.ready.then(() => true);
